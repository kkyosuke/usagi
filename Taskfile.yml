version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Run usagi with .usagi/local runtime state
    cmds:
      - USAGI_RUNTIME_MODE=local cargo run

  dev:
    desc: Run usagi with .usagi/dev runtime state
    cmds:
      - USAGI_RUNTIME_MODE=development cargo run

  prd:
    desc: Run the release build with .usagi runtime state
    cmds:
      - USAGI_RUNTIME_MODE=production cargo run --release

  # The daemon tasks forward everything after `--` to `usagi daemon`, so any
  # subcommand and flag reaches it unchanged:
  #   task daemon:dev -- restart --force
  #   task daemon:dev -- status
  daemon:
    desc: 'Run a usagi daemon subcommand with .usagi/local runtime state (task daemon -- restart --force)'
    cmds:
      - USAGI_RUNTIME_MODE=local cargo run -- daemon {{.CLI_ARGS}}

  'daemon:dev':
    desc: 'Run a usagi daemon subcommand with .usagi/dev runtime state (task daemon:dev -- restart --force)'
    cmds:
      - USAGI_RUNTIME_MODE=development cargo run -- daemon {{.CLI_ARGS}}

  'daemon:prd':
    desc: 'Run a usagi daemon subcommand on the release build with .usagi runtime state (task daemon:prd -- restart --force)'
    cmds:
      - USAGI_RUNTIME_MODE=production cargo run --release -- daemon {{.CLI_ARGS}}
