name: Test metrics

on:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

concurrency:
  group: test-metrics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nextest-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # stable

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          shared-key: rust-test-metrics

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7c6f5444541685720fe90ed47f7fa10f12f790f5 # nextest

      - name: Run full suite three times
        run: |
          mkdir -p test-metrics
          status=0
          for attempt in 1 2 3; do
            if ! cargo nextest run --profile metrics --workspace --no-fail-fast; then
              status=1
            fi
            mv target/nextest/metrics/junit.xml "test-metrics/junit-${attempt}.xml"
          done
          exit "$status"

      - name: Summarize slow tests and variance
        if: always()
        run: ruby scripts/summarize-nextest-junit.rb test-metrics/junit-*.xml | tee test-metrics/summary.md

      - name: Upload duration reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nextest-duration-${{ github.run_id }}
          path: test-metrics/
          retention-days: 90
