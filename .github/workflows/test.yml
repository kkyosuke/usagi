name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect Rust gate changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - id: classify
      name: Classify changed paths
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: scripts/ci/required-contexts.sh changed "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  rust-lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rustfmt, clippy

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: rust-lint

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

  full-test-run:
    name: Rust full test
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview

    - name: Rust Cache
      uses: swatinem/rust-cache@v2
      with:
        cache-on-failure: true
        shared-key: rust-full-test

    - name: Run tests
      run: |
        set +e
        cargo test --workspace --quiet > /tmp/usagi-cargo-test.log 2>&1
        status=$?
        set -e
        tail -n 160 /tmp/usagi-cargo-test.log
        exit "$status"

    - name: Test recommended-test selector
      run: bash scripts/tests/recommend-tests.sh

    - name: Test nextest JUnit summarizer
      run: bash scripts/tests/summarize-nextest-junit.sh

    - name: Test coverage report comment generator
      run: bash scripts/tests/coverage-report-comment.sh

    - name: Test coverage(off) policy linter
      run: bash scripts/tests/coverage-off-lint.sh

    - name: Install cargo-llvm-cov for v1 coverage fixture
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Test v1 coverage gate
      run: bash scripts/tests/v1-coverage.sh

    - name: Enforce coverage(off) registry
      run: ruby scripts/coverage-off-lint.rb

    - name: Test v1 release-version detector
      run: bash scripts/tests/v1-version-changed.sh

    - name: Test verified installer transaction
      run: bash scripts/tests/install.sh

    - name: Test release verification artifacts
      run: bash scripts/tests/release-verification-artifacts.sh

  policy-checks:
    name: Lightweight repository policy checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Test required context contract
      run: bash scripts/tests/required-contexts.sh

    - name: Test root README contract checker
      run: bash scripts/tests/root-readme.sh

    - name: Enforce root README contract
      run: bash scripts/ci/root-readme.sh README.md

  test:
    name: test
    if: always()
    needs: [changes, rust-lint]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Report Rust lint result
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        REQUIRED: ${{ needs.changes.outputs.rust }}
        RUN_RESULT: ${{ needs.rust-lint.result }}
      run: |
        scripts/ci/required-contexts.sh report "$REQUIRED" "$CHANGES_RESULT" "$RUN_RESULT"

  full-test:
    name: full-test
    if: always()
    needs: [changes, full-test-run, policy-checks]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Report full test result
      env:
        CHANGES_RESULT: ${{ needs.changes.result }}
        REQUIRED: ${{ needs.changes.outputs.rust }}
        RUN_RESULT: ${{ needs.full-test-run.result }}
        POLICY_RESULT: ${{ needs.policy-checks.result }}
      run: |
        scripts/ci/required-contexts.sh report "$REQUIRED" "$CHANGES_RESULT" "$RUN_RESULT" "$POLICY_RESULT"
