name: Release

# リリース成果物はルートの v2 パッケージのバイナリ。
#
# ビルドは `--features production` を付ける。この feature が無い artifact は
# USAGI_RUNTIME_MODE 未指定時に local を既定にするため、利用者のデータが
# ~/.usagi/local/ に入ってしまう（正本は document/05-daemon.md#artifact-の既定-mode）。
#
# 対象は installer（scripts/install.sh）が実際に配れる 3 プラットフォームに限る。
# install.sh の platform_asset は darwin / linux だけを受け付け、それ以外は fail する。
# v2 は Unix domain socket の IPC と Unix 専用の process / permission API に依存するため
# Windows ではコンパイルできない（usagi-core だけで libc::kill / SIGKILL / pid_t /
# std::os::unix / PermissionsExt::mode / CommandExt::process_group が解決しない）。

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0). Defaults to the pushed tag.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-notes:
    name: Generate release notes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Collect changelog
        id: changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # 直近の「自分以外の」タグを前回リリースとして範囲を決める
          PREV_TAG="$(git tag --sort=-v:refname | grep -vxF "$TAG" | head -n1 || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
            echo "range: $PREV_TAG..HEAD"
          else
            RANGE="HEAD"
            echo "range: (all history)"
          fi
          {
            echo 'log<<__CHANGELOG_EOF__'
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo
            echo '__CHANGELOG_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Generate release notes via GitHub Models
        id: notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.log }}
        run: |
          set -euo pipefail

          SYSTEM_PROMPT='あなたは Rust 製 CLI/TUI ツール「usagi」のリリース担当です。与えられた git コミットログをもとに、日本語で簡潔なリリースノートを Markdown で書いてください。要件: (1) 冒頭にこのリリースの概要を 1〜2 文。(2) 変更を「✨ 新機能 / 🐛 修正 / 🔧 内部改善 / 📝 ドキュメント」などの見出しで分類し箇条書き。(3) 該当のないカテゴリは省略。(4) コミットハッシュや PR 番号は省いて読み手にわかりやすく言い換える。(5) 文書タイトル(# 見出し)は付けず本文から始める。'

          USER_PROMPT="$(printf 'バージョン %s のリリースノートを作成してください。以下はコミットログです:\n\n%s' "$TAG" "$CHANGELOG")"

          # GitHub Models API へのリクエストボディを jq で安全に組み立てる
          REQ_BODY="$(jq -n \
            --arg model "openai/gpt-4o-mini" \
            --arg system "$SYSTEM_PROMPT" \
            --arg user "$USER_PROMPT" \
            '{
              model: $model,
              temperature: 0.3,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $user}
              ]
            }')"

          HTTP_CODE="$(curl -sS -w '%{http_code}' -o response.json \
            -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d "$REQ_BODY" || echo "000")"

          NOTES=""
          if [ "$HTTP_CODE" = "200" ]; then
            NOTES="$(jq -r '.choices[0].message.content // ""' response.json)"
          else
            echo "::warning::GitHub Models API failed (HTTP ${HTTP_CODE}); falling back to commit log."
            cat response.json || true
          fi

          # 取得失敗時はコミットログをそのままノートにフォールバック
          if [ -z "$NOTES" ] || [ "$NOTES" = "null" ]; then
            NOTES="$CHANGELOG"
          fi

          {
            echo 'notes<<__NOTES_EOF__'
            echo "$NOTES"
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

  build-and-release:
    name: Build and Release
    needs: release-notes
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: usagi
            asset_name: usagi-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: usagi
            asset_name: usagi-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: usagi
            asset_name: usagi-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # component は日付なし nightly へ入り、実際のビルドは rust-toolchain.toml が
      # pin した nightly で走る。target は pin した toolchain へ追加する必要があるため
      # ここでは targets: を使わず rustup target add で入れる。
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Add release target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} --features production

      - name: Prepare artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" dist/
          cd dist
          # installer は tar.gz の中に唯一の top-level entry `usagi` があることを検証する。
          ASSET_FILENAME="${{ matrix.asset_name }}.tar.gz"
          tar -czvf "../$ASSET_FILENAME" "${{ matrix.artifact_name }}"
          cd ..
          if command -v sha256sum >/dev/null 2>&1; then
            SHA256="$(sha256sum "$ASSET_FILENAME" | awk '{print $1}')"
          else
            SHA256="$(shasum -a 256 "$ASSET_FILENAME" | awk '{print $1}')"
          fi
          printf '%s  %s\n' "$SHA256" "$ASSET_FILENAME" > "$ASSET_FILENAME.sha256"
          printf '%s\n' "$RELEASE_TAG" > "$ASSET_FILENAME.version"
          {
            echo "ASSET_FILENAME=$ASSET_FILENAME"
            echo "CHECKSUM_FILENAME=$ASSET_FILENAME.sha256"
            echo "VERSION_FILENAME=$ASSET_FILENAME.version"
          } >> "$GITHUB_ENV"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            ${{ env.ASSET_FILENAME }}
            ${{ env.CHECKSUM_FILENAME }}
            ${{ env.VERSION_FILENAME }}
          body: ${{ needs.release-notes.outputs.notes }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
