name: Markdown Link Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Markdown gate changes
    runs-on: ubuntu-latest
    outputs:
      markdown: ${{ steps.classify.outputs.markdown }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: classify
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci/required-contexts.sh changed "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  link-check-run:
    name: Markdown links
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # リポジトリ内の全 Markdown の相対リンク・アンカー・外部 URL を検証する。
      # 設定（リトライ・除外・フラグメント検証）は lychee.toml に集約する。
      - name: Check links in Markdown
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --no-progress
            '*.md'
            'document/**/*.md'
            'v1/README.md'
            'v1/document/**/*.md'
            '.agents/**/*.md'
            '.github/**/*.md'
          fail: true
        env:
          # github.com のリンクをレートリミットを抑えて検証するため。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-link-check:
    name: markdown-link-check
    if: always()
    needs: [changes, link-check-run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Report Markdown link result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.markdown }}
          RUN_RESULT: ${{ needs.link-check-run.result }}
        run: |
          scripts/ci/required-contexts.sh report "$REQUIRED" "$CHANGES_RESULT" "$RUN_RESULT"
