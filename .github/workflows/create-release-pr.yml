name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version component to update'
        required: true
        default: patch
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # ビルドは rust-toolchain.toml が pin した nightly で走るため、component も
      # そちらへ届く前提で入れる（正本は document/06-conventions.md）。
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Update version in Cargo.toml
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(grep -m1 '^version[[:space:]]*=' Cargo.toml \
            | sed -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')"
          RELEASE_VERSION="$(scripts/ci/next-release-version.sh "$CURRENT_VERSION" "$RELEASE_BUMP")"
          printf 'version=%s\n' "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

          # リリース対象はルートの v2 パッケージなので、ルート Cargo.toml の最初の
          # version = "..." を選択した component の次バージョンで上書きする。
          sed -i -e "0,/^version = \".*\"/{s/^version = \".*\"/version = \"${RELEASE_VERSION}\"/}" Cargo.toml

          # Cargo.lock も更新
          cargo check --workspace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.version.outputs.version }}"
          title: "chore: release v${{ steps.version.outputs.version }}"
          # 本文は PR テンプレートを通らないため、`Internal-Issue` マーカーを
          # 生成側で載せる（正本は document/06-conventions.md#プルリクエスト）。
          # version bump は内部 issue を完了させないので none で固定する。
          body: |
            Bump version to `${{ steps.version.outputs.version }}` for the next release.

            > [!NOTE]
            > Merging this PR will trigger the `Auto Release on Version Bump` workflow to automatically create the release tag and publish the artifacts.

            Internal-Issue: none
          branch: "chore/release-v${{ steps.version.outputs.version }}"
          base: main
