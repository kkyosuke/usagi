[toolchain]
# nightly は日付で pin する。`channel = "nightly"` のままだと CI が毎回その日の nightly を取り、
# 新しく安定化した lint（例: clippy の `assert_is_empty`）が既存コードで一斉に発火して、
# 無関係な PR まで Rust lint で落ちる。実際 2026-08-11 の main はこの drift だけで赤になった。
# 更新は「pin を上げる PR」で意図的に行い、そこで新 lint の対応もまとめる。
#
# Rust / fmt / clippy / coverage はこの日付の同じ toolchain を使う。
channel = "nightly-2026-10-31"
# CI の bootstrap は日付なしの nightly を導入する。プロジェクトの build / test が使う
# 日付付き toolchain の component はこの一覧を正本とし、fmt / clippy / coverage に
# 必要なものをすべてここで持つ。
components = ["llvm-tools-preview", "rustfmt", "clippy"]
